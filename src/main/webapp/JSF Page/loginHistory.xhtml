<!DOCTYPE html>
<html xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">

<h:head>
    <title>Login History</title>

    <style>
        body {
            font-family: Segoe UI;
            background: #F1F5F9;
            padding: 30px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.1);
        }

        h2 {
            margin-bottom: 20px;
            color: #0F172A;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #0F172A;
            color: white;
            padding: 12px;
            text-align: left;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #E2E8F0;
            font-size: 14px;
        }

        .badge {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            color: white;
        }

        .login {
            background: #22C55E;
        }

        .logout {
            background: #EF4444;
        }

        .device {
            font-size: 12px;
            color: #64748B;
        }

    </style>
</h:head>

<h:body>

<div class="container">

    <h2>🔐 Login History</h2>

    <h:dataTable value="#{loginHistoryBean.allLogs}" var="l">

        <h:column>
            <f:facet name="header">User</f:facet>
            #{l.userId.fullName}
        </h:column>

        <h:column>
            <f:facet name="header">IP Address</f:facet>
            #{l.ipAddress}
        </h:column>

        <h:column>
            <f:facet name="header">Device</f:facet>
            <div class="device">#{l.deviceInfo}</div>
        </h:column>

        <h:column>
            <f:facet name="header">Login Time</f:facet>
            #{l.loginTime}
        </h:column>

        <h:column>
            <f:facet name="header">Logout Time</f:facet>
            #{l.logoutTime}
        </h:column>

        <h:column>
            <f:facet name="header">Status</f:facet>

            <h:panelGroup rendered="#{l.logoutTime == null}">
                <span class="badge login">Active</span>
            </h:panelGroup>

            <h:panelGroup rendered="#{l.logoutTime != null}">
                <span class="badge logout">Closed</span>
            </h:panelGroup>

        </h:column>

    </h:dataTable>

</div>

</h:body>
</html>
