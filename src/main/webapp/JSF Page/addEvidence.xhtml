
<!DOCTYPE html>
<html
xmlns:h="jakarta.faces.html"
xmlns:f="jakarta.faces.core">

<h:head>

<title>Add Evidence</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
background:#F8FAFC;
padding:40px;
}

.form-card{
max-width:900px;
margin:auto;
background:white;
padding:30px;
border-radius:15px;
box-shadow:0 5px 20px rgba(0,0,0,.08);
}

h1{
margin-bottom:25px;
color:#0F172A;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
}

.form-group{
display:flex;
flex-direction:column;
}

label{
font-weight:600;
margin-bottom:6px;
color:#0F172A;
}

.input{
width:100%;
padding:12px;
border:1px solid #d1d5db;
border-radius:8px;
outline:none;
}

.input:focus{
border-color:#06B6D4;
box-shadow:0 0 5px rgba(6,182,212,.3);
}

.textarea{
height:100px;
resize:none;
}

.btns{
margin-top:25px;
}

.save-btn{
background:#22C55E;
color:white;
border:none;
padding:12px 25px;
border-radius:8px;
cursor:pointer;
font-size:15px;
}

.save-btn:hover{
opacity:.9;
}

.cancel-btn{
background:#DC2626;
color:white;
padding:12px 25px;
border-radius:8px;
text-decoration:none;
margin-left:10px;
}

.cancel-btn:hover{
opacity:.9;
}

.full{
grid-column:1/3;
}

</style>

</h:head>

<h:body>

<div class="form-card">

<h1>Upload Evidence</h1>

<h:form enctype="multipart/form-data">

<div class="grid">

<div class="form-group">
<label>Evidence Name</label>

<h:inputText
value="#{evidenceBean.evidence.evidenceName}"
styleClass="input"/>
</div>

<div class="form-group">
<label>Case</label>

<h:selectOneMenu value="#{evidenceBean.selectedCaseId}">
    <f:selectItem itemLabel="Select Case" itemValue="" />
    <f:selectItems
        value="#{evidenceBean.cases}"
        var="c"
        itemValue="#{c.caseId}"
        itemLabel="#{c.caseNumber} - #{c.title}" />
</h:selectOneMenu>

</div>

<div class="form-group">
<label>Category</label>

<h:selectOneMenu value="#{evidenceBean.selectedCategoryId}" styleClass="input">

    <f:selectItem itemLabel="Select Category" itemValue="" />

    <f:selectItems
        value="#{evidenceBean.categories}"
        var="cat"
        itemValue="#{cat.categoryId}"
        itemLabel="#{cat.categoryName}" />

</h:selectOneMenu>
</div>

<div class="form-group full">
<label>Upload</label>

<h:inputFile value="#{evidenceBean.file}" styleClass="input" />

</div>


<div class="form-group full">
<label>Description</label>

<h:inputTextarea
value="#{evidenceBean.evidence.description}"
styleClass="input textarea"/>
</div>

</div>

<div class="btns">

<h:commandButton value="Upload Evidence"
    action="#{evidenceBean.saveEvidence}"
    rendered="#{accessControlBean.hasPermission('UPLOAD_EVIDENCE')}" />

<h:link
outcome="evidence.xhtml"
value="Cancel"
styleClass="cancel-btn"/>

</div>

</h:form>

</div>

</h:body>

</html>
