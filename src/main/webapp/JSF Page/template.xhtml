<!DOCTYPE html>
<html xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets">

<h:head>
    <title>DEMS System</title>

    <style>
        body {
            margin:0;
            font-family:Segoe UI;
            display:flex;
            height:100vh;
        }

        /* SIDEBAR */
        .sidebar {
            width:250px;
            background:#0F172A;
            color:white;
            padding:20px;
            position:fixed;
            height:100%;
        }

        .sidebar a {
            display:block;
            color:white;
            text-decoration:none;
            padding:12px;
            margin:5px 0;
            border-radius:8px;
        }

        .sidebar a:hover {
            background:#1E293B;
        }

        /* MAIN CONTENT */
        .main {
            margin-left:250px;
            padding:20px;
            width:100%;
            background:#F8FAFC;
        }

        .logo {
            font-size:20px;
            font-weight:bold;
            margin-bottom:20px;
        }
    </style>
</h:head>

<h:body>

    <!-- SIDEBAR -->
    <div class="sidebar">

        <div class="logo">🔐 DEMS</div>

        <h:link value="Dashboard" outcome="dashboard.xhtml" />
        <h:link value="Cases" outcome="cases.xhtml" />
        <h:link value="Evidence" outcome="evidence.xhtml" />
        <h:link value="Audit Logs" outcome="audit.xhtml" />
        <h:link value="Users" outcome="users.xhtml" />

    </div>

    <!-- MAIN CONTENT AREA -->
    <div class="main">

        <ui:insert name="content" />

    </div>

</h:body>
</html>
