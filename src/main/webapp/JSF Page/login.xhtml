<!DOCTYPE html>
<html xmlns:h="jakarta.faces.html">

<h:head>

    <title>DEMS Login</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI',sans-serif;
        }

        body{

            background:linear-gradient(
                    135deg,
                    #0F172A,
                    #1E293B);

            height:100vh;

            display:flex;

            justify-content:center;
            align-items:center;
        }

        .login-card{

            width:420px;

            background:#FFFFFF;

            padding:40px;

            border-radius:20px;

            box-shadow:
            0 15px 40px rgba(0,0,0,0.25);
        }

        .logo{

            text-align:center;

            margin-bottom:30px;
        }

        .logo h1{

            color:#0F172A;

            font-size:42px;

            margin-bottom:10px;
        }

        .logo p{

            color:#64748B;

            font-size:15px;
        }

        .form-group{

            margin-bottom:20px;
        }

        .form-group label{

            display:block;

            margin-bottom:8px;

            color:#0F172A;

            font-weight:600;
        }

        .input-field{

            width:100%;

            padding:14px;

            border:1px solid #CBD5E1;

            border-radius:10px;

            font-size:15px;
        }

        .input-field:focus{

            outline:none;

            border-color:#06B6D4;

            box-shadow:
            0 0 8px rgba(6,182,212,0.3);
        }

        .login-btn{

            width:100%;

            padding:14px;

            background:#06B6D4;

            color:white;

            border:none;

            border-radius:10px;

            font-size:16px;

            font-weight:bold;

            cursor:pointer;

            transition:0.3s;
        }

        .login-btn:hover{

            background:#0891B2;
        }

        .forgot{

            text-align:right;

            margin-top:10px;
            margin-bottom:20px;
        }

        .forgot a{

            text-decoration:none;

            color:#06B6D4;
        }

        .footer{

            margin-top:25px;

            text-align:center;

            color:#64748B;

            font-size:13px;
        }

        .security-badge{

            text-align:center;

            color:#22C55E;

            margin-bottom:20px;

            font-weight:bold;
        }

    </style>

</h:head>

<h:body>

    <div class="login-card">

        <div class="logo">

            <h1>DEMS</h1>

            <p>
                Digital Evidence Management System
            </p>

        </div>

        <div class="security-badge">
            🔒 Secure Access Portal
        </div>

        <h:form>

            <div class="form-group">

                <label>Email Address</label>

                <h:inputText
                    value="#{loginBean.email}"
                    styleClass="input-field"/>

            </div>

            <div class="form-group">

                <label>Password</label>

                <h:inputSecret
                    value="#{loginBean.password}"
                    styleClass="input-field"/>

            </div>

            <div class="forgot">

                <a href="#">
                    Forgot Password?
                </a>

            </div>

            <h:commandButton
                value="Login"
                action="#{loginBean.login()}"
                styleClass="login-btn"/>

        </h:form>

        <div class="footer">

            Secure Digital Forensics and Evidence Platform

        </div>

    </div>

</h:body>

</html>
